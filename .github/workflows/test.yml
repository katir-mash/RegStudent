name: Registry checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run regression and integration tests
        run: python -m pytest -v --junitxml=junit.xml
      - name: Check application with Bandit
        run: python -m bandit -q registry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: junit.xml
